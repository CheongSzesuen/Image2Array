name: Build Windows EXE and Publish to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        run: |
          echo "VERSION=$(echo ${{ github.ref }} | sed -e 's/.*v//')" >> $GITHUB_ENV

      - name: Build Windows x64 EXE
        run: |
          pyinstaller --onefile --windowed --name Image2Array-Windows-x64-${{ env.VERSION }} --distpath ./dist/x64 Image2Array.py --hidden-import=PyQt5.sip

      - name: Build Windows x86 EXE
        run: |
          pyinstaller --onefile --windowed --name Image2Array-Windows-x86-${{ env.VERSION }} --distpath ./dist/x86 Image2Array.py --hidden-import=PyQt5.sip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist/

  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous release tag
        id: get_previous_tag
        run: |
          PREVIOUS_TAG=$(curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | \
            jq --arg current_tag "${{ github.ref_name }}" \
            '[.[] | select(.tag_name | startswith("v"))] | map(select(.tag_name < $current_tag)) | sort_by(.tag_name) | last | .tag_name' \
            | tr -d '"')
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_ENV

      - name: Generate release notes
        id: generate_release_notes
        run: |
          # 获取提交日志
          if [[ -z "${{ env.PREVIOUS_TAG }}" ]]; then
            COMMIT_LOG=$(git log --format="- %s [%an]%n  %b" --no-merges --since="1 month ago")
          else
            COMMIT_LOG=$(git log --format="- %s [%an]%n  %b" --no-merges ${{ env.PREVIOUS_TAG }}..HEAD)
          fi

          # 准备变量
          VERSION="${{ env.VERSION }}"
          RUN_TIME=$(date -d "${{ github.run_started_at }}" "+%Y年%m月%d日 %H:%M UTC")
          RUN_LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # 生成多行Release Notes（关键修复部分）
          RELEASE_BODY=$(cat << RELEASE_EOF
## 🚀 新版本 v${VERSION}

### 📝 更新内容

${COMMIT_LOG}

### 🛠️ 构建信息
- **构建时间**: ${RUN_TIME}
- **构建详情**: [点击查看](${RUN_LINK})
RELEASE_EOF
          )

          # 写入环境变量（GitHub官方推荐方式）
          delimiter="EOF_$(openssl rand -hex 8)"
          echo "RELEASE_BODY<<${delimiter}" >> $GITHUB_ENV
          echo "${RELEASE_BODY}" >> $GITHUB_ENV
          echo "${delimiter}" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Image2Array v${{ env.VERSION }}
          body: ${{ env.RELEASE_BODY }}
          draft: false
          prerelease: false

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist/

      - name: Upload EXE to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x64/Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload x86 EXE to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x86/Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream