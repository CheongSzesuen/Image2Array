name: Build Windows EXE and Publish to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to get commit logs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        run: |
          echo "VERSION=$(echo ${{ github.ref }} | sed -e 's/.*v//')" >> $GITHUB_ENV

      - name: Build Windows x64 EXE
        run: |
          pyinstaller --onefile --windowed --name Image2Array-Windows-x64-${{ env.VERSION }} --distpath ./dist/x64 Image2Array.py --hidden-import=PyQt5.sip

      - name: Build Windows x86 EXE
        run: |
          pyinstaller --onefile --windowed --name Image2Array-Windows-x86-${{ env.VERSION }} --distpath ./dist/x664 Image2Array.py --hidden-import=PyQt5.sip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist/

  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to get commit logs

      - name: Get previous release tag
        id: get_previous_tag
        run: |
          # Get the last release tag before the current one
          PREVIOUS_TAG=$(curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" | \
            jq --arg current_tag "${{ github.ref_name }}" \
            '.[] | select(.tag_name | startswith("v") and .tag_name < $current_tag) | .tag_name' | \
            sort -V | tail -n 1 | tr -d '"')
          echo "PREVIOUS_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> $GITHUB_ENV

      - name: Generate release notes
        id: generate_release_notes
        run: |
          if [ -z "${{ env.PREVIOUS_TAG }}" ]; then
            COMMIT_LOG=$(git log --format="* %s (%an) - %b\n" --no-merges --since="1 month ago")
          else
            COMMIT_LOG=$(git log --format="* %s (%an) - %b\n" --no-merges ${PREVIOUS_TAG}..HEAD)
          fi
          echo "RELEASE_NOTES=$(cat <<EOF
# Image2Array v${{ env.VERSION }}

## 更新内容

${COMMIT_LOG}

## 构建信息
- **构建时间**: ${{ github.run_started }}  
- **构建页面**: [查看构建页面](${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }})  
EOF
)" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          release_name: Image2Array v${{ env.VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false  # Set to true if you want to create a draft release
          prerelease: false  # Set to true if this is a pre-release

      - name: Upload EXE to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x64/Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload x86 EXE to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x86/Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream