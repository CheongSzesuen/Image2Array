name: Image2Array Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.2

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole ^
            --name Image2Array-${{ matrix.arch }} ^
            --add-data "originimage;originimage" ^
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/Image2Array-${{ matrix.arch }}.exe

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU (ARM64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-dev
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.2

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-${{ matrix.arch }} \
            --add-data "originimage:originimage" \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/Image2Array-${{ matrix.arch }}

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-${{ matrix.arch }} \
            --add-data "originimage:originimage" \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Image2Array-${{ matrix.arch }}

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src

      - name: Setup git environment
        run: |
          cd src
          git config --global --add safe.directory $GITHUB_WORKSPACE/src

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false  # 保持构件在各自目录中

      - name: Verify artifacts structure
        run: |
          echo "Artifacts directory structure:"
          ls -R artifacts
          echo "Checking files exist:"
          [ -f "artifacts/windows-x64/Image2Array-x64.exe" ] && echo "Windows x64 OK"
          [ -f "artifacts/windows-x86/Image2Array-x86.exe" ] && echo "Windows x86 OK"
          [ -f "artifacts/linux-x64/Image2Array-x64" ] && echo "Linux x64 OK"
          [ -f "artifacts/linux-arm64/Image2Array-arm64" ] && echo "Linux ARM64 OK"
          [ -f "artifacts/macos-x64/Image2Array-x64" ] && echo "macOS x64 OK"
          [ -f "artifacts/macos-arm64/Image2Array-arm64" ] && echo "macOS ARM64 OK"

      - name: Generate changelog
        id: changelog
        run: |
          cd src
          git fetch --tags --force
          
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")
          
          if [ -z "$previous_tag" ]; then
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)")
          else
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)" "$previous_tag".."$current_tag")
          fi

          delimiter=$(openssl rand -hex 16)
          echo "changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Get formatted date
        id: date
        run: echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          body: |
            ## 支持架构
            🐧 Linux (x64/ARM64) | 🍎 macOS (ARM64/x64) | 🪟 Windows (x86/x64)

            ## 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}

            ## 🛠️ 构建信息
            🕒 构建时间: ${{ steps.date.outputs.date }}  
            🏷️ 版本标签: ${{ github.ref_name }}  
            🔗 提交页面: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            artifacts/windows-x64/Image2Array-x64.exe
            artifacts/windows-x86/Image2Array-x86.exe
            artifacts/linux-x64/Image2Array-x64
            artifacts/linux-arm64/Image2Array-arm64
            artifacts/macos-x64/Image2Array-x64
            artifacts/macos-arm64/Image2Array-arm64