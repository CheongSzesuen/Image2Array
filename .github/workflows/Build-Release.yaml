name: Build Windows EXE and Publish to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version (Bash)
        id: get_version
        shell: bash  # 关键修复点
        run: |
          echo "VERSION=$(echo ${{ github.ref }} | sed -e 's/.*v//')" >> $GITHUB_ENV

      - name: Build x64 EXE
        run: |
          pyinstaller --onefile --windowed ^
            --name Image2Array-Windows-x64-${{ env.VERSION }} ^
            --distpath ./dist/x64 ^
            Image2Array.py ^
            --hidden-import=PyQt5.sip

      - name: Build x86 EXE
        run: |
          pyinstaller --onefile --windowed ^
            --name Image2Array-Windows-x86-${{ env.VERSION }} ^
            --distpath ./dist/x86 ^
            Image2Array.py ^
            --hidden-import=PyQt5.sip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist/

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags --force
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")

          # 生成原始提交日志
          if [ -z "$previous_tag" ]; then
            messages=$(git log --reverse --pretty=format:"- %s%n  ↳ %an (%h)%n%n%b")
          else
            messages=$(git log --reverse --pretty=format:"- %s%n  ↳ %an (%h)%n%n%b" "$previous_tag".."$current_tag")
          fi

          # 转义特殊字符
          sanitized_messages=$(echo "$messages" | sed -e 's/\\/\\\\/g' -e 's/\$/\\\$/g' -e 's/`/\\`/g')

          # 安全输出处理
          delimiter=$(openssl rand -hex 12)
          echo "messages<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$sanitized_messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT


      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Image2Array v${{ env.VERSION }}
          body: ${{ fromJson(steps.release_notes.outputs.body) }}
          draft: false
          prerelease: false

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist

      - name: Upload x64 EXE
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x64/Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x64-${{ env.VERSION }}.exe

      - name: Upload x86 EXE
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x86/Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x86-${{ env.VERSION }}.exe