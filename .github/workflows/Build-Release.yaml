name: Build Windows EXE and Publish to Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        run: |
          version=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "VERSION=$version" >> $GITHUB_ENV

      - name: Build Windows x64 EXE
        run: |
          pyinstaller --onefile --windowed ^
            --name Image2Array-Windows-x64-${{ env.VERSION }} ^
            --distpath ./dist/x64 ^
            Image2Array.py ^
            --hidden-import=PyQt5.sip

      - name: Build Windows x86 EXE
        run: |
          pyinstaller --onefile --windowed ^
            --name Image2Array-Windows-x86-${{ env.VERSION }} ^
            --distpath ./dist/x86 ^
            Image2Array.py ^
            --hidden-import=PyQt5.sip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist/

  publish:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags --force
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")

          if [ -z "$previous_tag" ]; then
            echo "No previous tag found. Generating full changelog"
            messages=$(git log --reverse --pretty=format:"- %s%n  ↳ %an (%h)%n%n%b")
          else
            echo "Generating changelog from $previous_tag to $current_tag"
            messages=$(git log --reverse --pretty=format:"- %s%n  ↳ %an (%h)%n%n%b" "$previous_tag".."$current_tag")
          fi

          delimiter=$(openssl rand -hex 16)
          echo "messages<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Compose release notes
        id: release_notes
        run: |
          current_time=$(date -d "${{ github.run_started_at }}" "+%Y-%m-%d %H:%M %Z")
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          delimiter=$(openssl rand -hex 16)
          echo "body<<${delimiter}" >> $GITHUB_OUTPUT
          cat << EOF >> $GITHUB_OUTPUT
# 🚀 Image2Array v${{ env.VERSION }}

## 📜 更新内容
${{ steps.changelog.outputs.messages }}

## 🛠️ 构建信息
- **构建时间**: $current_time
- **构建日志**: [${{ github.run_number }}]($run_url)
${delimiter}
EOF

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Image2Array v${{ env.VERSION }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Image2Array-EXE
          path: ./dist

      - name: Upload x64 EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x64/Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x64-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream

      - name: Upload x86 EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/x86/Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_name: Image2Array-Windows-x86-${{ env.VERSION }}.exe
          asset_content_type: application/octet-stream