name: Image2Array Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.13.0
          pip install pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.16

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole ^
          --name Image2Array ^
          --add-data "image_data.h;." ^
          Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/Image2Array.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array \
            --add-data "image_data.h:." \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Image2Array

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array \
            --add-data "image_data.h:." \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Image2Array

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

          - uses: softprops/action-gh-release@v1
          with:
            tag_name: ${{ github.ref_name }}
            name: "Image2Array ${{ github.ref_name }}"
            body: |
              ## 支持架构
              🐧 Linux (x64/ARM64) | 🍎 macOS (ARM64/x64) | 🪟 Windows (x86/x64)
        
              ## 📝 更新日志
              ${{ steps.changelog.outputs.changelog }}
        
              ## 🛠️ 构建信息
              🕒 构建时间: ${{ steps.build-info.outputs.time }} (UTC+8)  
              🏷️ 版本标签: ${{ github.ref_name }}  
              🔗 提交页面: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})