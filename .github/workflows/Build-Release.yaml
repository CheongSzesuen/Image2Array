name: Image2Array Multi-Platform Builder

on:
  push:
    tags:
      - 'v*'  # 仅当标签以 'v' 开头时触发

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
        include:
          - arch: x64
            python_arch: x64
            artifact_suffix: "windows-x64"
            file_ext: ".exe"
          - arch: x86
            python_arch: x86
            artifact_suffix: "windows-x86"
            file_ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean workspace
        run: Remove-Item -Recurse -Force build, dist, __pycache__ -ErrorAction SilentlyContinue

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
        
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.16
          
          pyinstaller --onefile --noconsole ^
            --name Image2Array ^
            Image2Array.py
          
          $version = $env:GITHUB_REF_NAME.Substring(1)  # 去掉 'v' 前缀
          $newName = "Image2Array-${{ matrix.artifact_suffix }}-$version${{ matrix.file_ext }}"
          Rename-Item -Path "dist\Image2Array.exe" -NewName $newName
          dir dist
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: dist/Image2Array-${{ matrix.artifact_suffix }}-*

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU (ARM64 only)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Set up build environment
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Build executable
        run: |
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.16
          
          if [ "${{ matrix.arch }}" == "arm64" ]; then
              export CC=aarch64-linux-gnu-gcc
              export CXX=aarch64-linux-gnu-g++
          fi
          
          pyinstaller --onefile --noconsole \
            --name Image2Array \
            Image2Array.py
          
          version=${GITHUB_REF#refs/tags/v}
          mv dist/Image2Array "dist/Image2Array-linux-${{ matrix.arch }}-$version"
          file dist/Image2Array-linux-${{ matrix.arch }}-*

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/Image2Array-linux-${{ matrix.arch }}-*

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean workspace
        run: rm -rf build dist __pycache__

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Build executable
        run: |
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.16
          
          if [ "${{ matrix.arch }}" == "arm64" ]; then
              export ARCHFLAGS="-arch arm64"
          else
              export ARCHFLAGS="-arch x86_64"
          fi
          
          pyinstaller --onefile --noconsole \
            --name Image2Array \
            Image2Array.py
          
          version=${GITHUB_REF#refs/tags/v}
          mv dist/Image2Array "dist/Image2Array-macos-${{ matrix.arch }}-$version"
          file dist/Image2Array-macos-${{ matrix.arch }}-*

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Image2Array-macos-${{ matrix.arch }}-*

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Verify all binaries
        run: |
          echo "=== 可执行文件验证 ==="
          ls -R release-files
          
          declare -a required_files=(
            "Image2Array-windows-x64-*.exe"
            "Image2Array-windows-x86-*.exe"
            "Image2Array-linux-x64-*"
            "Image2Array-linux-arm64-*"
            "Image2Array-macos-x64-*"
            "Image2Array-macos-arm64-*"
          )
          
          missing_files=0
          for pattern in "${required_files[@]}"; do
            matches=(release-files/$pattern)
            if [ ${#matches[@]} -eq 0 ] || [ ! -e "${matches[0]}" ]; then
              echo "❌ 文件匹配失败: $pattern"
              missing_files=1
            else
              echo "✅ 文件存在: ${matches[0]}"
              file "${matches[0]}"
            fi
          done
          
          [ $missing_files -eq 0 ] || exit 1

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags --force
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")
          
          if [ -z "$previous_tag" ]; then
            messages=$(git log --reverse --pretty=format:"- %s%n  ↳ 提交人: %an (%h)")
          else
            messages=$(git log --reverse --pretty=format:"- %s%n  ↳ 提交人: %an (%h)" "$previous_tag".."$current_tag")
          fi
          
          delimiter=$(openssl rand -hex 16)
          echo "changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Generate build info
        id: build-info
        run: |
          echo "time=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
          echo "platforms= 🪟 Windows (x86/x64) | 🍎 macOS (ARM64/x64) | 🐧 Linux (x64/ARM64)" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "🎉 Image2Array ${{ github.ref_name }}"
          body: |
            ## 📦 多平台构建结果
            
            ### 支持架构
            ${{ steps.build-info.outputs.platforms }}
            
            ### 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}
            
            ### 🛠️ 构建信息
            - 🕒 构建时间: ${{ steps.build-info.outputs.time }} (UTC+8)
            - 🏷️ 版本标签: ${{ github.ref_name }}
            - 🔗 提交记录: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            
            ### 🔍 文件验证
            ```bash
            # 查看文件信息
            file Image2Array-*
            ```
          files: |
            release-files/Image2Array-*