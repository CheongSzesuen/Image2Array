name: Image2Array Builder

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYQT5_QT5_VERSION: 5.15.16

jobs:
  validate-structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: |
          required_files=(
            "Image2Array.py"
            "requirements.txt"
            "originimage/example.jpg"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ Project structure validated"

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: validate-structure
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.arch }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          pip install pyinstaller==6.13.0
      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole ^
            --name Image2Array-Windows-${{ matrix.arch }} ^
            --add-data "image_data.h;." ^
            Image2Array.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/Image2Array-Windows-${{ matrix.arch }}.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-dev
          pip install -r requirements.txt
          pip install pyinstaller==6.13.0
      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-Linux \
            --add-data "image_data.h:." \
            Image2Array.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/Image2Array-Linux

  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.13.0
      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-macOS \
            --add-data "image_data.h:." \
            Image2Array.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/Image2Array-macOS

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          body: |
            ## Multi-platform Build
            
            ### Supported Architectures
            - Windows (x64/x86)
            - Linux (x64)
            - macOS (ARM64)
            
            ### Build Info
            - Version: ${{ github.ref_name }}
            - Build Date: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          files: |
            artifacts/windows-x64/Image2Array-Windows-x64.exe
            artifacts/windows-x86/Image2Array-Windows-x86.exe
            artifacts/linux-x64/Image2Array-Linux
            artifacts/macos-arm64/Image2Array-macOS