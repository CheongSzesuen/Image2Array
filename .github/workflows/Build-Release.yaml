name: Cross-Platform Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows 构建
          - os: windows-latest
            arch: x64
            exe_name: Image2Array-Windows-x64
            shell: cmd
            line_continuation: "^"
          - os: windows-latest
            arch: x86
            exe_name: Image2Array-Windows-x86
            shell: cmd
            line_continuation: "^"

          # Linux 构建
          - os: ubuntu-22.04
            arch: x64
            exe_name: Image2Array-Linux-x64
            shell: bash
            line_continuation: '\'

          # macOS 构建
          - os: macos-14
            arch: arm64
            exe_name: Image2Array-macOS-arm64
            shell: bash
            line_continuation: '\'

    steps:
      - uses: actions/checkout@v4

      - name: 提取版本号
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'x86' && 'x86' || 'x64' }}

      - name: 安装系统依赖
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y libxcb-xinerama0
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install libomp
          fi

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.7.0

      - name: 构建可执行文件
        shell: ${{ matrix.shell }}
        run: |
          pyinstaller --onefile --noconsole ${{ matrix.line_continuation }} \
            --name ${{ matrix.exe_name }}-${{ env.VERSION }} ${{ matrix.line_continuation }} \
            --hidden-import PyQt5.QtCore ${{ matrix.line_continuation }} \
            --hidden-import PyQt5.QtGui ${{ matrix.line_continuation }} \
            --hidden-import PyQt5.QtWidgets ${{ matrix.line_continuation }} \
            --add-data "venv/Lib/site-packages/PyQt5/Qt5/plugins:PyQt5/Qt5/plugins" \
            image_converter.py

          # macOS 签名 (可选)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            codesign --deep --force --verbose \
              --sign "Apple Development" \
              dist/${{ matrix.exe_name }}-${{ env.VERSION }}
          fi

      - name: 打包成果
        run: |
          mkdir -p dist/${{ runner.os }}
          mv dist/${{ matrix.exe_name }}-${{ env.VERSION }}* dist/${{ runner.os }}/

      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/${{ runner.os }}/*

  publish:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 下载所有构建成果
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: 生成更新日志
        id: changelog
        run: |
          git fetch --tags --force
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")
          messages=$(git log --reverse --pretty=format:"- %s (%h)" "$previous_tag".."$current_tag")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Image2Array v${{ env.VERSION }}
          body: |
            ## 更新内容
            ${{ steps.changelog.outputs.changelog }}

            ## 支持平台
            - Windows x64/x86
            - Linux x64
            - macOS ARM64
          draft: false
          prerelease: false

      - name: 上传所有文件到 Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/**/*
          asset_name: ${{ fromJson('["' + (asset_path | split('/') | last + '"') }}