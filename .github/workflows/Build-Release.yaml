name: Image2Array Builder

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    defaults:
      run:
        working-directory: ./Image2Array
    steps:
      - uses: actions/checkout@v4

      - name: Clean workspace
        run: Remove-Item -Recurse -Force __pycache__, build, dist -ErrorAction SilentlyContinue

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate image_data.h
        run: |
          python Image2Array.py originimage/example.jpg

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole ^
            --name Image2Array-Windows-${{ matrix.arch }} ^
            --add-data "image_data.h:." ^
            Image2Array.py

      - name: Package artifacts
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          Rename-Item -Path "dist/Image2Array-Windows-${{ matrix.arch }}.exe" `
            -NewName "Image2Array-Windows-${{ matrix.arch }}-v$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: Image2Array/dist/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Image2Array
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate image_data.h
        run: |
          python Image2Array.py originimage/example.jpg

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-Linux \
            --add-data "image_data.h:." \
            Image2Array.py

      - name: Package artifacts
        run: |
          version=${GITHUB_REF#refs/tags/v}
          mv dist/Image2Array-Linux "dist/Image2Array-Linux-v$version"
          chmod +x dist/Image2Array-Linux-v$version

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: Image2Array/dist/Image2Array-Linux-*

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./Image2Array
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate image_data.h
        run: |
          python Image2Array.py originimage/example.jpg

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-macOS \
            --add-data "image_data.h:." \
            Image2Array.py

      - name: Package artifacts
        run: |
          version=${GITHUB_REF#refs/tags/v}
          mv dist/Image2Array-macOS "dist/Image2Array-macOS-v$version"
          chmod +x dist/Image2Array-macOS-v$version

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: Image2Array/dist/Image2Array-macOS-*

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Verify artifacts
        run: |
          echo "=== 验证生成文件 ==="
          find release-artifacts -type f -exec file {} \;
          echo "✅ 所有文件验证通过"

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          body: |
            ## 版本内容
            
            ### 包含文件
            - 主程序可执行文件
            - 自动生成的 image_data.h
            
            ### 使用说明
            1. 下载对应平台的可执行文件
            2. 将需要转换的图片放入 originimage 目录
            3. 运行程序生成新的 image_data.h
            
            ### 构建信息
            - 构建时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
            - 提交版本: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            release-artifacts/windows-binaries/*
            release-artifacts/linux-binary/*
            release-artifacts/macos-binary/*