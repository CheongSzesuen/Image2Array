name: Image2Array Builder

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYQT5_QT5_VERSION: 5.15.16  # 确认可用的Qt版本

jobs:
  validate-structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project structure
        run: |
          required_files=(
            "Image2Array.py"
            "requirements.txt"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              missing=1
            else
              echo "✅ File exists: $file"
            fi
          done
          exit $missing

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: validate-structure
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python ${{ matrix.arch }}
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.13.0

      - name: Build executable
        shell: cmd
        run: |
          pyinstaller --onefile --noconsole ^
            --name Image2Array-Windows-${{ matrix.arch }} ^
            Image2Array.py

      - name: Generate artifact name
        id: artifact-name
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          echo "artifact_name=windows-${{ matrix.arch }}-v$version" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/Image2Array-Windows-${{ matrix.arch }}.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          pip install pyinstaller==6.13.0

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-Linux \
            Image2Array.py

      - name: Generate artifact name
        id: artifact-name
        run: |
          version=${GITHUB_REF#refs/tags/v}
          echo "artifact_name=linux-x64-v$version" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/Image2Array-Linux

  build-macos:
    name: Build macOS
    runs-on: macos-14
    needs: validate-structure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.13.0

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-macOS \
            Image2Array.py

      - name: Generate artifact name
        id: artifact-name
        run: |
          version=${GITHUB_REF#refs/tags/v}
          echo "artifact_name=macos-arm64-v$version" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/Image2Array-macOS

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '*-v*'
          merge-multiple: true

      - name: Rename artifacts
        run: |
          find release-artifacts -type f -name "*.exe" -exec mv {} {}_${GITHUB_REF#refs/tags/v} \;
          find release-artifacts -type f ! -name "*.*" -exec mv {} {}-${GITHUB_REF#refs/tags/v} \;

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          body: |
            ## 跨平台可执行文件

            ### 使用说明
            1. 下载对应平台的可执行文件
            2. 在程序目录创建 `originimage` 文件夹
            3. 将要转换的图片放入该目录
            4. 运行程序生成 image_data.h

            ### 版本信息
            - 构建版本: ${{ github.ref_name }}
            - 构建时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          files: |
            release-artifacts/*