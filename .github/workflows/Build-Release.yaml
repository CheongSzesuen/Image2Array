name: Image2Array Builder

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYQT5_QT5_VERSION: 5.15.16  # 使用最新可用版本

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # 禁用 pip 版本警告并安装依赖
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install pyinstaller==6.13.0
          pip install pillow==11.2.1
          pip install PyQt5==5.15.11 PyQt5-Qt5==${{ env.PYQT5_QT5_VERSION }}

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-macOS-${{ env.PYQT5_QT5_VERSION }} \
            --add-data "image_data.h:." \
            Image2Array.py

      - name: Generate unique artifact name
        id: artifact-name
        run: |
          version=${GITHUB_REF#refs/tags/v}
          timestamp=$(date +%Y%m%d%H%M%S)
          echo "artifact_name=macos-artifact-$version-$timestamp" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/Image2Array-macOS-*

  # 其他平台的构建配置保持不变...

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '*artifact-*'  # 匹配动态生成的制品名称
          merge-multiple: true

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          files: |
            release-artifacts/**/*