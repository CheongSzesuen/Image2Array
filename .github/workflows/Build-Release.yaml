name: Image2Array Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
      - name: Build executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole Image2Array.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/Image2Array.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole Image2Array.py
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/Image2Array

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build executable
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole Image2Array.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Image2Array

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '*'
          merge-multiple: true

      - name: Verify artifacts
        run: ls -lh release-artifacts

      - name: Generate changelog
        id: changelog
        run: |
          git fetch --tags --force
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")
          
          if [ -z "$previous_tag" ]; then
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)")
          else
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)" "$previous_tag".."$current_tag")
          fi
          
          delimiter=$(openssl rand -hex 16)
          echo "changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          body: |
            ## 支持架构
            🐧 Linux (x64) | 🍎 macOS | 🪟 Windows (x86/x64)

            ## 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}

            ## 🛠️ 构建信息
            🕒 构建时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")  
            🏷️ 版本标签: ${{ github.ref_name }}  
            🔗 提交页面: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            release-artifacts/windows-x64/Image2Array.exe
            release-artifacts/windows-x86/Image2Array.exe
            release-artifacts/linux/Image2Array
            release-artifacts/macos/Image2Array