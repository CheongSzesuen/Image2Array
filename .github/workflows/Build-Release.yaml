name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            arch: x86
            suffix: .exe
            pyarch: x86
          - os: windows-latest
            arch: x64
            suffix: .exe
            pyarch: x64
            
          # Linux builds
          - os: ubuntu-latest
            arch: x64
            suffix: ''
            pyarch: x86_64 # 使用通用的 x86_64 架构标识
          - os: ubuntu-latest
            arch: arm64
            suffix: ''
            pyarch: aarch64 # 使用通用的 aarch64 架构标识
            
          # macOS builds
          - os: macos-latest
            arch: x64
            suffix: ''
            pyarch: x86_64
          - os: macos-latest
            arch: arm64
            suffix: ''
            pyarch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        architecture: ${{ matrix.pyarch }}
        cache: 'pip' # 启用 pip 缓存以提高效率

    - name: Verify Python
      run: |
        python --version
        which python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --name Image2Array \
          --add-data 'originimage:originimage' \
          --add-data 'image:image' \
          script.py
      env:
        PYTHONOPTIMIZE: 2

    - name: Rename artifact
      run: |
        $version = "${{ github.ref_name }}".Replace("v", "")
        $platform = "${{ runner.os }}" -replace "macOS", "macos"
        $platform = $platform -replace "Ubuntu", "linux"
        $new_name = "Image2Array-${platform}-${{ matrix.arch }}-v${version}${{ matrix.suffix }}"
        Move-Item dist/Image2Array${{ matrix.suffix }} $new_name
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image2Array-${{ runner.os }}-${{ matrix.arch }}
        path: ${{ format('Image2Array-{0}-{1}-v{2}{3}', runner.os, matrix.arch, steps.version.outputs.version, matrix.suffix) }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Get version info
      id: version
      run: |
        version=${GITHUB_REF#refs/tags/v}
        echo "version=${version}" >> $GITHUB_OUTPUT
        echo "full_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Detect prerelease
      id: prerelease
      run: |
        if [[ "${{ github.ref_name }}" == *"-beta"* ]] || [[ "${{ github.ref_name }}" == *"-rc"* ]]; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Get previous release
      id: prev_release
      run: |
        response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases")
        
        latest_published=$(echo "$response" | jq -r '[.[] | select(.draft == false) | .tag_name][0]')
        
        if [ "$latest_published" = "null" ]; then
          echo "prev_tag=" >> $GITHUB_OUTPUT
        else
          echo "prev_tag=$latest_published" >> $GITHUB_OUTPUT
        fi

    - name: Generate changelog
      id: changelog
      run: |
        if [ -z "${{ steps.prev_release.outputs.prev_tag }}" ]; then
          LOG=$(git log --pretty=format:"- %s (%h)%n%b")
        else
          LOG=$(git log ${{ steps.prev_release.outputs.prev_tag }}..${{ github.ref }} --pretty=format:"- %s (%h)%n%b")
        fi

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "### Changes since ${{ steps.prev_release.outputs.prev_tag || 'initial commit' }}" >> $GITHUB_OUTPUT
        echo "$LOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: Image2Array ${{ steps.version.outputs.version }}
        prerelease: ${{ steps.prerelease.outputs.prerelease }}
        body: |
          ### Release Type
          ${{ format('{} Release', steps.prerelease.outputs.prerelease == 'true' && 'Preview' || 'Stable') }}

          ### Supported Architectures
          🖥️ Windows (x86, x64)  
          🐧 Linux (x64, arm64)  
          🍎 macOS (x64, arm64)

          ### Build Info
          🕒 Build Time: $(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M:%S %Z")  
          🏷️ Version: ${{ steps.version.outputs.version }}  
          📦 Full Tag: ${{ steps.version.outputs.full_tag }}  
          📚 Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

          ${{ steps.changelog.outputs.changelog }}
        files: |
          artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}