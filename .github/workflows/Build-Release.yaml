name: Image2Array Release Builder

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    # Windows构建配置保持不变...

  build-linux:
    # Linux构建配置保持不变...

  build-macos:
    # macOS构建配置保持不变...

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 关键修复点：获取完整git历史
          path: src       # 指定检出路径

      - name: Setup git environment
        run: |
          # 切换到检出目录
          cd src
          git config --global --add safe.directory $GITHUB_WORKSPACE/src

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          cd src  # 关键修复点：进入git仓库目录
          git fetch --tags --force
          
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")
          
          # 生成带格式的更新日志
          if [ -z "$previous_tag" ]; then
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)")
          else
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)" "$previous_tag".."$current_tag")
          fi

          delimiter=$(openssl rand -hex 16)
          echo "changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          body: |
            ## 支持架构
            🐧 Linux (x64/ARM64) | 🍎 macOS (ARM64/x64) | 🪟 Windows (x86/x64)

            ## 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}

            ## 🛠️ 构建信息
            🕒 构建时间: $(date -u +"%Y-%m-%dT%H:%M:%SZ")  
            🏷️ 版本标签: ${{ github.ref_name }}  
            🔗 提交页面: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            artifacts/windows-x64/Image2Array.exe
            artifacts/windows-x86/Image2Array.exe
            artifacts/linux-x64/Image2Array
            artifacts/macos-arm64/Image2Array