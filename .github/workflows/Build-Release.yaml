name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Get version
        id: get_version
        run: |
          echo "VERSION=$(echo ${{ github.ref }} | sed -e 's/.*v//')" >> $GITHUB_ENV

      - name: Build Windows x64 EXE
        run: |
          pyinstaller --onefile --windowed --name Image2Array-Windows-x64-${{ env.VERSION }} --distpath ./dist/x64 image_converter.py --hidden-import=PyQt5.sip

      - name: Build Windows x86 EXE
        run: |
          pyinstaller --onefile --windowed --name Image2Array-Windows-x86-${{ env.VERSION }} --distpath ./dist/x86 --win-private-assemblies image_converter.py --hidden-import=PyQt5.sip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Image2Array-EXE
          path: dist/