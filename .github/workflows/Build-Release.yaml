name: Image2Array Builder

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  PYQT_VERSION: 5.15.16  # 使用最新的兼容版本

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.0
          pip install pyinstaller==6.13.0
          pip install pillow==11.2.1
          pip install PyQt5==5.15.11 PyQt5-Qt5==${{ env.PYQT_VERSION }}

      - name: Build executable (Windows)
        shell: cmd  # 强制使用CMD解释器
        run: |
          pyinstaller --onefile --noconsole ^
          --name Image2Array-Windows-${{ matrix.arch }} ^
          --add-data "image_data.h;." ^
          Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-dev
          python -m pip install --upgrade pip==24.0
          pip install pyinstaller==6.13.0
          pip install pillow==11.2.1
          pip install PyQt5==5.15.11 PyQt5-Qt5==${{ env.PYQT_VERSION }}

      - name: Build executable (Linux)
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-Linux \
            --add-data "image_data.h:." \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/Image2Array-Linux

  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies (macOS)
        run: |
          python -m pip install --upgrade pip==24.0
          pip install pyinstaller==6.13.0
          pip install pillow==11.2.1
          pip install PyQt5==5.15.11 PyQt5-Qt5==${{ env.PYQT_VERSION }}

      - name: Build executable (macOS)
        run: |
          pyinstaller --onefile --noconsole \
            --name Image2Array-macOS \
            --add-data "image_data.h:." \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/Image2Array-macOS

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          files: |
            release-artifacts/windows-binaries/*
            release-artifacts/linux-binary/*
            release-artifacts/macos-binary/*