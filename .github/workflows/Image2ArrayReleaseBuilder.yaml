name: Image2Array Release Builder

on:
  push:
    tags:
      - 'v*.*.*'      # 正式版格式 v1.0.0
      - 'v*.*.*-beta*' # beta版格式 v1.0.0-beta1
      - 'v*.*.*-rc'    # 预发布版格式 v1.0.0-rc
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.2

      - name: Build executable
        shell: cmd
        run: |
          TAG=${{ github.ref_name }}
          pyinstaller --onefile --noconsole ^
            --name Image2Array-${{ matrix.arch }}-${TAG} ^
            --add-data "originimage;originimage" ^
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/Image2Array-${{ matrix.arch }}-${TAG}.exe

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU (ARM64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get install -y python3-dev
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11 PyQt5-Qt5==5.15.2

      - name: Build executable
        run: |
          TAG=${{ github.ref_name }}
          pyinstaller --onefile --noconsole \
            --name Image2Array-${{ matrix.arch }}-${TAG} \
            --add-data "originimage:originimage" \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/Image2Array-${{ matrix.arch }}-${TAG}

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pillow==11.2.1 PyQt5==5.15.11

      - name: Build executable
        run: |
          TAG=${{ github.ref_name }}
          pyinstaller --onefile --noconsole \
            --name Image2Array-${{ matrix.arch }}-${TAG} \
            --add-data "originimage:originimage" \
            Image2Array.py

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Image2Array-${{ matrix.arch }}-${TAG}

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: src

      - name: Setup git environment
        run: |
          cd src
          git config --global --add safe.directory $GITHUB_WORKSPACE/src

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: false

      - name: Verify artifacts structure
        run: |
          echo "Artifacts directory structure:"
          ls -R artifacts
          echo "Checking files exist:"
          TAG=${{ github.ref_name }}
          
          # 检查 Windows x64 文件
          if [ -f "artifacts/windows-x64/Image2Array-x64-${TAG}.exe" ]; then
            echo "Windows x64 OK"
          else
            echo "Windows x64 NOT FOUND"
            exit 1
          fi
          
          # 检查 Windows x86 文件
          if [ -f "artifacts/windows-x86/Image2Array-x86-${TAG}.exe" ]; then
            echo "Windows x86 OK"
          else
            echo "Windows x86 NOT FOUND"
            exit 1
          fi
          
          # 检查 Linux x64 文件
          if [ -f "artifacts/linux-x64/Image2Array-x64-${TAG}" ]; then
            echo "Linux x64 OK"
          else
            echo "Linux x64 NOT FOUND"
            exit 1
          fi
          
          # 检查 Linux ARM64 文件
          if [ -f "artifacts/linux-arm64/Image2Array-arm64-${TAG}" ]; then
            echo "Linux ARM64 OK"
          else
            echo "Linux ARM64 NOT FOUND"
            exit 1
          fi
          
          # 检查 macOS x64 文件
          if [ -f "artifacts/macos-x64/Image2Array-x64-${TAG}" ]; then
            echo "macOS x64 OK"
          else
            echo "macOS x64 NOT FOUND"
            exit 1
          fi
          
          # 检查 macOS ARM64 文件
          if [ -f "artifacts/macos-arm64/Image2Array-arm64-${TAG}" ]; then
            echo "macOS ARM64 OK"
          else
            echo "macOS ARM64 NOT FOUND"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          TAG=${{ github.ref_name }}
          cp artifacts/windows-x64/Image2Array-x64-${TAG}.exe release_assets/Image2Array-windows-x64-${TAG}.exe
          cp artifacts/windows-x86/Image2Array-x86-${TAG}.exe release_assets/Image2Array-windows-x86-${TAG}.exe
          cp artifacts/linux-x64/Image2Array-x64-${TAG} release_assets/Image2Array-linux-x64-${TAG}
          cp artifacts/linux-arm64/Image2Array-arm64-${TAG} release_assets/Image2Array-linux-arm64-${TAG}
          cp artifacts/macos-x64/Image2Array-x64-${TAG} release_assets/Image2Array-macos-x64-${TAG}
          cp artifacts/macos-arm64/Image2Array-arm64-${TAG} release_assets/Image2Array-macos-arm64-${TAG}
          chmod +x release_assets/Image2Array-linux-*
          chmod +x release_assets/Image2Array-macos-*
          ls -lh release_assets/

      - name: Determine release type
        id: release-type
        run: |
          TAG=${{ github.ref_name }}
          
          if [[ "$TAG" == *-beta* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_type=测试版本（Beta）" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == *-rc ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "release_type=预发布版本（Release Candidate）" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "release_type=正式版本（Stable）" >> $GITHUB_OUTPUT
          fi
          echo "Detected release type: ${{ steps.release-type.outputs.release_type }}"

      - name: Generate changelog
        id: changelog
        run: |
          cd src
          git fetch --tags --force
          
          current_tag=${{ github.ref_name }}
          previous_tag=$(git describe --tags --abbrev=0 "$current_tag^" 2>/dev/null || echo "")
          
          if [ -z "$previous_tag" ]; then
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)\n%b")
          else
            messages=$(git log --reverse --pretty=format:"- %s ↳ %an (%h)\n%b" "$previous_tag".."$current_tag")
          fi

          delimiter=$(openssl rand -hex 16)
          echo "changelog<<${delimiter}" >> $GITHUB_OUTPUT
          echo "$messages" >> $GITHUB_OUTPUT
          echo "${delimiter}" >> $GITHUB_OUTPUT

      - name: Get Beijing time
        id: time
        run: |
          export TZ=Asia/Shanghai
          echo "time=$(date '+%Y-%m-%d %H:%M:%S CST')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "Image2Array ${{ github.ref_name }}"
          prerelease: ${{ steps.release-type.outputs.is_prerelease }}
          body: |
            ## 发布类型
            ${{ steps.release-type.outputs.release_type }}

            ## 支持架构
            🐧 Linux (x64/ARM64) | 🍎 macOS (ARM64/x64) | 🪟 Windows (x86/x64)

            ## 📝 更新日志
            ${{ steps.changelog.outputs.changelog }}

            ## 🛠️ 构建信息
            🕒 构建时间: ${{ steps.time.outputs.time }}  
            🏷️ 版本标签: ${{ github.ref_name }}  
            🔗 提交页面: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          files: |
            release_assets/Image2Array-windows-x64-${{ github.ref_name }}.exe
            release_assets/Image2Array-windows-x86-${{ github.ref_name }}.exe
            release_assets/Image2Array-linux-x64-${{ github.ref_name }}
            release_assets/Image2Array-linux-arm64-${{ github.ref_name }}
            release_assets/Image2Array-macos-x64-${{ github.ref_name }}
            release_assets/Image2Array-macos-arm64-${{ github.ref_name }}