name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows builds
          - os: windows-latest
            arch: x86
            suffix: .exe
            pyarch: 32
          - os: windows-latest
            arch: x64
            suffix: .exe
            pyarch: 64
          
          # Linux builds
          - os: ubuntu-latest
            arch: x64
            suffix: ''
            pyarch: 64
          - os: ubuntu-latest
            arch: arm64
            suffix: ''
            pyarch: arm64
          
          # macOS builds
          - os: macos-latest
            arch: x64
            suffix: ''
            pyarch: 64
          - os: macos-latest
            arch: arm64
            suffix: ''
            pyarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: ${{ matrix.pyarch }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile --name Image2Array \
          --add-data 'originimage:originimage' \
          --add-data 'image:image' \
          script.py
      env:
        PYTHONOPTIMIZE: 2

    - name: Rename artifact
      run: |
        $version = "${{ github.ref_name }}".Replace("v", "")
        $platform = "${{ runner.os }}" -replace "macOS", "macos"
        if ("${{ runner.os }}" -eq "Windows") { $platform = "Windows" }
        $new_name = "Image2Array-${platform}-${{ matrix.arch }}-v${version}${{ matrix.suffix }}"
        Move-Item dist/Image2Array${{ matrix.suffix }} $new_name
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Image2Array-${{ runner.os }}-${{ matrix.arch }}
        path: ${{ format('Image2Array-{0}-{1}-v{2}{3}', runner.os, matrix.arch, steps.version.outputs.version, matrix.suffix) }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Get version
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Generate changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref }}^ 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          LOG=$(git log --pretty=format:"- %s (%h)%n%b")
        else
          LOG=$(git log $PREV_TAG..${{ github.ref }} --pretty=format:"- %s (%h)%n%b")
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$LOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: Image2Array ${{ steps.version.outputs.version }}
        body: |
          ### Supported Architectures
          🖥️ Windows (x86, x64)
          🐧 Linux (x64, arm64)
          🍎 macOS (x64, arm64)

          ### Build Info
          🕒 Build Time: $(TZ=Asia/Shanghai date +"%Y-%m-%d %H:%M:%S %Z")
          🏷️ Version: ${{ steps.version.outputs.version }}
          📚 Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

          ### Changelog
          ${{ steps.changelog.outputs.changelog }}
        files: |
          artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}